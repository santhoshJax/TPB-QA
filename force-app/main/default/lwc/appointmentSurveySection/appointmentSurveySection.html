<template>
    <lightning-card title="Survey" icon-name="standard:survey">
        <lightning-layout horizontal-align="center" multiple-rows>
            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="3" padding="around-small">
                <template if:true={surveyObjectInfo.data}>
                    <p class="field-title">Record Type</p>
                    <lightning-combobox
                        label=""
                        value={recordType}
                        options={recordTypes}
                        onchange={recordTypeHandler}
                        variant="label-hidden">
                    </lightning-combobox>
                </template>
            </lightning-layout-item>
        </lightning-layout>
        <template if:true={surveyCreateDefaults.data}>
            <template if:true={recordType}>
                <lightning-record-form
                    object-api-name={surveyForm.sObject}
                    fields={surveyForm.fields}
                    record-type-id={recordType}
                    onsubmit={handleSubmit}
                    onsuccess={handleSuccess}>
                </lightning-record-form>
            </template>
        </template>
    </lightning-card>
    <template if:true={spinner}>
        <div id="spinner" class="slds-spinner_container slds-is-fixed">
            <div role="status" class="slds-spinner slds-spinner_large slds-spinner_brand">
                <div class="slds-spinner__dot-a"></div>
                <div class="slds-spinner__dot-b"></div>
            </div>
        </div>
    </template>
</template>
