<template>
    <lightning-card title="Parent Account Files" icon-name="standard:file">
        <template if:true={files}>
            <lightning-datatable
                key-field="id"
                data={files}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>

        </template>

        <template if:false={files}>
            <div class="slds-p-around_medium slds-text-color_weak">
                No parent files found.
            </div>
        </template>
    </lightning-card>
</template>
