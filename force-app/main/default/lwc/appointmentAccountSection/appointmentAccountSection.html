    <template if:true={contacts}>
        <lightning-card title="Contacts" icon-name="standard:contact">
            <template for:each={contacts} for:item="contact" for:index="index">
                    <lightning-layout class="rows" key={contact.Id} multiple-rows>
                        <lightning-layout-item size="12" small-device-size="2" medium-device-size="2" large-device-size="2" padding="around-small">
                            <p class="field-title">Actions</p>
                            <template if:true={contact.confirmDelete}>
                                <div><b>Confirm Delete</b></div>
                                <lightning-button-icon icon-name="utility:like" variant="bare" size="large" onclick={yesDeleteContact} data-index={index}
                                                    title="Delete">
                                </lightning-button-icon>
                                <lightning-button-icon icon-name="utility:dislike" variant="bare" size="large" onclick={noDeleteContact} data-index={index}
                                                    class="slds-p-left_medium" title="Do Not Delete">
                                </lightning-button-icon>
                            </template>
                            <template if:false={contact.confirmDelete}>
                                <lightning-button-icon icon-name="action:delete" variant="bare" size="large" onclick={removeContact} data-index={index}>
                                </lightning-button-icon>
                            </template>
                    </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">First Name</p>
                            <lightning-input name="FirstName" label="" variant="label-hidden" value={contact.FirstName} onchange={updateContact} data-index={index}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">Last Name</p>
                            <lightning-input name="LastName" label="" variant="label-hidden" value={contact.LastName} onchange={updateContact} data-index={index}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">Email</p>
                            <lightning-input name="Email" type="email" label="" variant="label-hidden" value={contact.Email} onchange={updateContact} data-index={index}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">Phone</p>
                            <lightning-input name="Phone" type="tel" label="" variant="label-hidden" value={contact.Phone} onchange={updateContact} data-index={index}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">Other Phone</p>
                            <lightning-input name="OtherPhone" type="tel" label="" variant="label-hidden" value={contact.OtherPhone} onchange={updateContact} data-index={index}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">Title</p>
                            <div class="slds-form-element">
                                <div class="slds-form-element__control">
                                    <div class="slds-select_container">
                                        <c-picklist-util line-value={contact.Title2__c} items={contactTitles} index={index}
                                                         onselect={selectHandler} field-name="Title2__c" object-type="contact">
                                        </c-picklist-util>
                                    </div>
                                </div>
                            </div>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">Decision Maker</p>
                            <lightning-input type="checkbox" label="" variant="label-hidden" checked={contact.Decision_Maker__c} onchange={updateContact} data-index={index}
                                             name="Decision_Maker__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                            <p class="field-title">Availability</p>                         
                            <lightning-input name="Sunday" type="checkbox" label="Sunday" checked={contact.Sunday} onchange={updateContact} data-index={index}>
                            </lightning-input>
                            <lightning-input name="Monday" type="checkbox" label="Monday" checked={contact.Monday} onchange={updateContact} data-index={index}>
                            </lightning-input>
                            <lightning-input name="Tuesday" type="checkbox" label="Tuesday" checked={contact.Tuesday} onchange={updateContact} data-index={index}>
                            </lightning-input>
                            <lightning-input name="Wednesday" type="checkbox" label="Wednesday" checked={contact.Wednesday} onchange={updateContact} data-index={index}>
                            </lightning-input>
                            <lightning-input name="Thursday" type="checkbox" label="Thursday" checked={contact.Thursday} onchange={updateContact} data-index={index}>
                            </lightning-input>
                            <lightning-input name="Friday" type="checkbox" label="Friday" checked={contact.Friday} onchange={updateContact} data-index={index}>
                            </lightning-input>
                            <lightning-input name="Saturday" type="checkbox" label="Saturday" checked={contact.Saturday} onchange={updateContact} data-index={index}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="4" padding="around-small">
                            <p class="field-title">Note</p>
                            <lightning-textarea name="Contact_Note__c" label="" variant="label-hidden" value={contact.Contact_Note__c} onchange={updateContact} data-index={index}>
                            </lightning-textarea>
                        </lightning-layout-item>
                    </lightning-layout>
            </template>
            <div class="slds-m-top_small slds-m-left_small">
                <lightning-button variant="brand" label="New Contact" onclick={newContact} icon-name="utility:record_create"></lightning-button>
            </div>
        </lightning-card>
        <div class="slds-m-top_medium">
            <lightning-button variant="brand" label="Save" onclick={saveContacts}></lightning-button>
        </div>
    </template>

                                <div class="slds-form-element">

                                            </c-picklist-util>
                                        </div>
                                    </div>
                                </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" small-device-size="6" medium-device-size="4" large-device-size="2" padding="around-small">
                                <p class="field-title">Supplier ID</p>

                                </lightning-input>

                </template>
                <div class="slds-m-top_small slds-m-left_small">
