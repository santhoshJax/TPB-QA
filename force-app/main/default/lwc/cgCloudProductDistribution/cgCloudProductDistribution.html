<template>
    <template if:true={productDistributSpinner}>
        <div class="spinner-container">
            <lightning-spinner alternative-text="Loading" class="spinner-class" data-id="spinner"
                message="Loading data..." size="medium" variant="base"></lightning-spinner>
        </div>
    </template>
    <div class="header slds-p-left_small  slds-p-right_small slds-p-bottom_small slds-grid slds-grid_align-spread">
        <div class="slds-grid">
            <button class="slds-button backButton" onclick={navigateToStoreCockpit}>
                <lightning-icon icon-name="utility:back" alternative-text="back" size="xx-small" title="large size"
                    variant="inverse" class="slds-p-right_x-small utility-icon"></lightning-icon>
                <span> back </span>
            </button>
            <h2 class=" slds-p-left_small slds-text-heading_medium">{selectedCustomerAccount}</h2>
        </div>
        <div>
            <lightning-button icon-name="utility:add" label="Add Product" variant="brand" class="slds-button greenBackgroundButton"
                onclick={openProductsModel}>
            </lightning-button>
            
            <c-cg-cloud-barcode-scanner 
                account-id={accountId} 
                visit-id={visitId} 
                product-distribution-data={defaultData}
                onscanpopupclosed={handleScanPopupClosed}>
            </c-cg-cloud-barcode-scanner>

        </div>
    </div>
    <div class="slds-p-left_small  slds-p-right_small slds-p-bottom_small">
        <lightning-input type="search" label="Search" class="slds-col" onchange={handleSearchChange}></lightning-input>
        <template if:true={isProductDistribution}>
            <lightning-layout multiple-rows>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="8" large-device-size="8">
                    <div class="slds-card slds-p-around_small product-table">
                        <!-- Header Row -->
                        <div class="slds-grid slds-p-around_x-small slds-border_bottom slds-theme_shade table-header"
                            style="border-radius: 10px 10px 0px 0px;">
                            <!-- <div class="slds-col slds-size_1-of-12 icon-col slds-text-title_caps">Icon</div> -->
                            <div class="slds-col slds-size_11-of-12 product-name slds-text-title_caps">Product</div>
                            <div
                                class="slds-col  slds-text-align_center status-col slds-text-title_caps">
                                Distrib.
                            </div>
                            <!-- <div class="slds-col slds-size_1-of-12 action-col"></div> -->
                        </div>
                        <div class="product-table-container">
                            <!-- Grouped Product Sections -->
                            <template for:each={groupedProductData} for:item="group">
                                <div key={group.label} class="group-section">
                                    <div
                                        class="group-header slds-p-around_xx-small slds-theme_shade slds-text-title_bold">
                                        {group.label}
                                    </div>

                                    <!-- Product Rows -->
                                    <template for:each={group.items} for:item="item">
                                        <div key={item.id} aria-selected={item.ariaSelected}
                                            class="product-row slds-grid slds-p-around_x-small slds-border_bottom selectable-row"
                                            data-id={item.id} onclick={handleProductClick} style="cursor: pointer;">

                                            <div class="slds-col  product-name">
                                                {item.name}
                                            </div>

                                            <div class="slds-col slds-size_1-of-12 status-col">
                                                <div data-id={item.id} class="slds-grid">
                                                    <span class={item.statusClass} onclick={handleChangeStatus} data-id={item.id} data-name={item.originalStatus}>{item.statusText}</span>
                                                   
                                                   <template if:true={item.isDeletable}>
                                                        <span>
                                                            <lightning-icon icon-name="utility:delete" alternative-text="delete" size="x-small"
                                                                title="delete Product Distribution" variant="error" data-id={item.visitJobId} class="slds-p-left_small delete-icon"
                                                                onclick={handleDeleteVisitJob}></lightning-icon>
                                                        </span>
                                                   </template> 
                                                  
                                                </div>
                                            </div>

                                            <!-- <div class="slds-col slds-size_1-of-12 action-col">
                                                                        <lightning-button-icon icon-name="utility:threedots_vertical" variant="bare"
                                                                            alternative-text="More"></lightning-button-icon>
                                                                    </div> -->
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-layout-item>
                <template if:true={isProductSelected}>
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="4" large-device-size="4">
                        <div class="slds-card">
                            <section class="slds-p-top_small slds-p-bottom_small">
                                <h3 class="slds-text-title_caps group-header" style="border-radius: 10px 10px 0px 0px;">
                                    Wholesaler
                                    Details
                                </h3>
                                <template for:each={wholesalersData} for:item="w">
                                    <div key={w.accountId} class="slds-p-around_small slds-grid slds-grid_align-spread">
                                        <p>
                                            <strong>{w.accountName}</strong><br />
                                            Order Code: {w.sku}
                                        </p>
                                        <template if:true={w.clearingHouse}>
                                            <lightning-icon icon-name="action:goal" alternative-text="Connected" size="xx-small"
                                                title="large size" variant="inverse"></lightning-icon>
                                        </template>
                                    </div>
                                </template>
                    
                                <div class="slds-m-top_medium">
                                    <div class=" group-header">
                                        <h3 class="slds-text-title_caps ">Attachments</h3>
                                    </div>
                                    <p>(No attachments)</p>
                                </div>
                    
                                <div class="slds-m-top_medium ">
                                    <div class="group-header">
                                        <h3 class="slds-text-title_caps">Standard Survey Activities</h3>
                                    </div>
                                    <div class="slds-p-around_small slds-grid slds-grid_align-spread">
                                        <p><strong>Distribution</strong></p>
                                        <div>
                                            <div class="custom-picklist" onclick={toggleDropdown}>
                                                <span>{selectedValue}</span>
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    class="dropdown-icon"></lightning-icon>
                                            </div>
                                            <template if:true={dropdownOpen}>
                                                <ul class="dropdown-list">
                                                    <template for:each={productDistributorPicklistOptions} for:item="opt">
                                                        <li key={opt} data-id={selectedProductDistributorId}
                                                            onclick={handleChangeProductStatus}>{opt}</li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </template>
        <template if:false={isProductDistribution}>
          <div class="slds-m-top_medium">
            <lightning-card class="slds-text-align_center slds-p-top_medium slds-p-bottom_medium">
                <p class="slds-text-color_weak"><span><strong>No Products are available</strong></span>
                </p>
            </lightning-card>
          </div>
        
        </template>
        <!-- <div class="slds-grid slds-wrap slds-p-top_small">
        </div> -->
    </div>


    <template if:true={isModalOpen}>

        <section class="slds-modal slds-fade-in-open custom-modal">
            <div class="slds-modal__container modal-flex">
                <header class="slds-modal__header modal-header">
                    <h2 class="slds-text-heading_medium">Add Products</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"
                            size="small"></lightning-icon>
                    </button>
                </header>
                <div class="slds-modal__content modal-body">
                    <template if:true={isLoading}>
                        <div class="spinner-container">
                            <lightning-spinner alternative-text="Loading" class="spinner-class" data-id="spinner"
                                message="Loading data..." size="medium" variant="base"></lightning-spinner>
                        </div>
                    </template>

                    <div class="product-list-wrapper">
                        <c-cg-cloud-multiselect-picklist
                            label="Product"
                            multi-select="true"
                            onselectedoption={handleSelectProduct}
                            options={productsData}
                            selected-values={selectedProductsValue}>
                        </c-cg-cloud-multiselect-picklist>
                    </div>
                </div>
                <footer class="slds-modal__footer modal-footer slds-grid slds-grid_align-spread">
                    <div>
                        <lightning-button label="Cancel" class="slds-p-right_small" onclick={closeModal}
                            variant="neutral"></lightning-button>
                        <lightning-button label="Add Product" onclick={handleAddProduct} variant="brand"
                            disabled={isDisabled}></lightning-button>
                        
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
