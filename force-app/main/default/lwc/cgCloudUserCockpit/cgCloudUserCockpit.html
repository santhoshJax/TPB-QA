                                            <span>Today</span>

                                </div>

                                    data-accid={ctData.accountId}

    <template if:true={isRecordTypeModalOpen}>
        <section class="slds-modal slds-fade-in-open custom-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Select Account Record Type</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                        onclick={closeRecordTypeModal} style="top: 14px;right: 15px;">
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-radio-group
                        name="Account Record Type"
                        label=""
                        type="radio"
                        value={selectedAccountRecordTypeId}
                        options={accountRecordTypeOptions}
                        onchange={handleAccountRecordTypeChange}>
                    </lightning-radio-group>
                </div>
                <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                    <div>
                        <lightning-button label="Cancel" class="slds-p-right_small" onclick={closeRecordTypeModal}
                            variant="neutral"></lightning-button>
                        <lightning-button label="Continue" onclick={handleRecordTypeContinue} variant="brand"
                            disabled={isRecordTypeContinueDisabled}></lightning-button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={isModalOpen}>
    
        <section class="slds-modal slds-fade-in-open custom-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Add Customer Task</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                        onclick={closeModal} style="top: 14px;right: 15px;">
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoading}>
                        <div class="spinner-container">
                            <lightning-spinner alternative-text="Loading" class="spinner-class" data-id="spinner"
                                message="Loading data..." size="medium" variant="base"></lightning-spinner>
                        </div>
                    </template>
    
                    <div class=" slds-p-top_small">
                        <c-custom-lookup-search label="Customer" onselect={handleChangeCustomer} options={customerAccounts}
                            selected-value={selectedCustomerValue}></c-custom-lookup-search>
                        <lightning-combobox name="Customer Type" label="Customer Type" value={selectedCustomerType} placeholder=""
                                options={customerTaskTemplateOptions} onchange={handleChangeCustomerTask}></lightning-combobox>
                        <lightning-input 
                          type="text"
                          label="Description"
                          name="description"
                          value={description}
                          onchange={handleChangeCustomerTask}
                        ></lightning-input>
                    <lightning-input type="date" name="Due Date" label="Date" value={selectedCustomerTaskDate}
                        onchange={handleChangeCustomerTask}></lightning-input>
                        
    
                        
                    </div>
                </div>
                <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                    <div>
                        <lightning-button label="Cancel" class="slds-p-right_small" onclick={closeModal}
                            variant="neutral"></lightning-button>
                        <lightning-button label="Create" onclick={createTask} variant="brand"
                            disabled={isDisabled}></lightning-button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
